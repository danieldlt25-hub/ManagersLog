plugins { id 'com.android.application' }
android {
    namespace 'com.managerslog.app'
    compileSdk 35
    defaultConfig { applicationId 'com.managerslog.app'; minSdk 26; targetSdk 35; versionCode 17; versionName '1.3.7' }
    signingConfigs { release { storeFile file(System.getenv('HOME') + '/.android/release.keystore'); storePassword System.getenv('CLIMBING_STORE_PASSWORD'); keyAlias System.getenv('CLIMBING_KEY_ALIAS'); keyPassword System.getenv('CLIMBING_KEY_PASSWORD') } }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false; shrinkResources false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.core:core:1.13.1' }
