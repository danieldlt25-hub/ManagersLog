<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>Manager's Log</title><style>
:root{font-family:system-ui;--bg:#f4f6f6;--card:white;--ink:#23343a;--sub:#60727a;--accent:#356e69;--line:#dce3e3}body.dark{--bg:#101b1d;--card:#202e31;--ink:#edf3f3;--sub:#a9babb;--accent:#75b6ae;--line:#394a4d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{background:var(--card);border-bottom:1px solid var(--line);padding:17px;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}h2{font-size:20px}h3{font-size:16px;margin:14px 0 8px}main{padding:14px 14px 110px;max-width:650px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row>span{flex:1}button{border:0;border-radius:10px;background:var(--accent);color:white;padding:11px;font-weight:600;font-size:14px}button.secondary{background:var(--card);border:1px solid var(--line);color:var(--ink)}button.danger{background:#a23c3c}input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%}input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}textarea{min-height:90px}label{font-size:13px;display:block;margin:12px 0 5px;color:var(--sub)}small{color:var(--sub)}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}nav button{background:transparent;color:var(--sub);font-size:12px;border-radius:0;padding:15px 2px}nav button.active{color:var(--accent);background:rgba(90,130,125,.08)}.fab{position:fixed;right:15px;bottom:85px;border-radius:30px;box-shadow:0 4px 14px #0003}.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.counts button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:15px 3px}.counts strong{display:block;font-size:25px}.counts small{font-size:11px}.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}.item:last-child{border:0}.item .content{flex:1;overflow-wrap:anywhere;white-space:pre-wrap}.dim{opacity:.5}.photo{max-width:100%;max-height:180px;border-radius:8px;margin-top:6px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1}dialog{width:calc(100% - 24px);max-width:480px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:17px}dialog::backdrop{background:#0009}.muted{color:var(--sub)}.pill{color:#b44545;font-size:12px}#toast{position:fixed;bottom:75px;left:10px;right:10px;text-align:center;pointer-events:none}#toast span{display:inline-block;background:var(--ink);color:var(--card);padding:9px;border-radius:8px}

/* Compact, keyboard-safe Quick Note editor */

/* Manager's Log professional visual refresh */
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f5f7f7;--card:#fff;--ink:#152b30;--sub:#60757a;--accent:#103e35;--line:#e2e9e9;--soft:#edf4f2}
body.dark{--bg:#111d20;--card:#203033;--ink:#f1f6f5;--sub:#b2c1c1;--accent:#6bb9a8;--line:#36494b;--soft:#293f40}
body{font-size:16px;line-height:1.45}header{padding:18px 22px;background:var(--bg);border-bottom:0}header h1{font-size:24px;font-weight:760;letter-spacing:-.7px}header button{font-size:20px!important;padding:8px 13px!important;border-radius:13px!important}main{padding:14px 20px 115px}h2{font-size:23px;letter-spacing:-.4px;margin:10px 0 18px}h3{font-size:20px;letter-spacing:-.35px;margin:24px 0 12px}button{min-height:45px;border-radius:13px;font-size:15px;padding:11px 15px;transition:background .15s}button:active{opacity:.82}.card{border-radius:17px;padding:17px;border-color:var(--line);box-shadow:0 2px 8px #001a1208}.actions{gap:10px}.actions button{min-height:52px}.item{padding:15px 4px;align-items:center;gap:13px}.item .content{font-weight:610;line-height:1.5}.item small{font-size:13px;font-weight:450}input,textarea,select{border-radius:12px;padding:12px;font-size:16px}nav{background:#103e35;border:0;border-radius:19px 19px 0 0;box-shadow:0 -4px 16px #001a1518;overflow:hidden}nav button{color:#d4e5e0;min-height:68px;font-size:12px;font-weight:550;border-radius:0;padding:10px 0}nav button.active{color:white;background:#285c51}nav button .navicon{display:block;font-size:21px;line-height:1.2;margin-bottom:3px}body.dark nav{background:#102c28}.empty{padding:25px 14px;text-align:center;color:var(--sub);font-size:14px}.home-actions{margin:0 0 24px}.home-actions button{background:#103e35;color:white;font-size:16px;min-height:62px}.home-actions button:active{background:#285c51}.department-link{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;margin-bottom:8px;min-height:62px!important;padding:14px 16px!important;font-size:16px!important;font-weight:650}.department-link small{font-weight:400}.task-list{margin-top:13px}.task-list .item:last-child{border-bottom:0}
#editor{position:fixed;inset:auto 12px 12px;top:auto;margin:auto auto 0;width:calc(100% - 24px);max-width:470px;max-height:calc(100dvh - 24px);padding:0;overflow:hidden;border-radius:23px 23px 16px 16px;display:none;flex-direction:column;box-shadow:0 12px 35px #0003}
#editor[open]{display:flex}
#editor .editor-fields{overflow-y:auto;overscroll-behavior:contain;padding:18px 21px 8px;min-height:0;flex:1}
#editor .row h2{font-size:22px;margin:0}#editor .row>button{min-height:36px;padding:4px 10px}
#editor label{margin:12px 0 5px;font-size:14px;font-weight:500}
#editor textarea{height:92px;min-height:78px;font-size:16px;resize:vertical}
#editor select{font-size:16px;min-height:45px;padding:10px}
#editor .editor-footer{display:flex;gap:10px;padding:12px 20px max(15px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);flex-shrink:0}
#editor .editor-footer button{flex:1;min-height:48px;font-size:15px}

#editor .photo-actions button:disabled{opacity:.42}
#editor #preview{max-height:95px}
@media(max-height:650px){#editor{max-height:calc(100dvh - 8px)}#editor .editor-fields{padding:10px 15px 3px}#editor textarea{height:62px;min-height:58px}#editor .editor-footer{padding:8px 15px}}
#editor .editor-heading-actions{display:flex;gap:8px;align-items:center}#editor .priority-star{font-size:27px;line-height:1;padding:3px 9px;min-height:38px;min-width:41px}#editor .priority-star.selected{color:#e6a33a;background:var(--soft);border-color:#e6a33a}.priority-indicator{color:#e6a33a;font-size:19px;vertical-align:middle}header{padding-top:29px;padding-bottom:17px}#editor .editor-heading-actions button{width:44px;height:44px;min-width:44px;min-height:44px;padding:0;display:grid;place-items:center;font-size:27px;line-height:1}#editor .editor-heading-actions .priority-star{padding:0;font-size:27px}header h1{font-weight:850;letter-spacing:-.65px;font-size:25px}body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}header{flex-shrink:0}main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:90px}.task-list{max-height:calc(100dvh - 310px);overflow-y:auto;overscroll-behavior:contain}.scroll-list{max-height:calc(100dvh - 280px);overflow-y:auto;overscroll-behavior:contain}</style></head><body><header><h1>Manager's Log</h1><button class="secondary" onclick="screen='Settings';render()">⚙</button></header><main id="view"></main><nav id="nav"></nav><div id="toast"></div>
<dialog id="editor"><div class="editor-fields"><div class="row"><h2 id="editorTitle">Add Task</h2><div class="editor-heading-actions"><button id="priorityStar" type="button" class="secondary priority-star" onclick="togglePriority()" aria-label="Mark priority" aria-pressed="false">☆</button><button class="secondary" onclick="closeEditor()" aria-label="Close">×</button></div></div><label>Category</label><select id="dept"></select><label>Task</label><textarea id="body" placeholder="Enter task details..."></textarea><label>Photo</label><input type="file" id="photo" accept="image/*" capture="environment" style="display:none"><div class="photo-actions"><button class="secondary" onclick="el('photo').click()" type="button">◉ Take Photo</button><button class="secondary" id="removePhoto" onclick="photoData=null;el('photo').value='';showPhoto()" type="button">Remove Photo</button></div><img id="preview" class="photo" style="display:none"></div><div class="editor-footer"><button class="secondary" onclick="saveEditor(false)" id="saveSingle">Save</button><button onclick="saveEditor(true)" id="saveButton">Save + Next</button><button class="danger" onclick="deleteEditing()" id="deleteButton">Delete</button></div></dialog>
<script>
const defaults=['Pick-Up','Front-end','Produce','Meat','Drug/GM','Grocery','Deli','Bakery','Dairy/Frozen'];const KEY='managerslog.v1';const dk='managerslog.drafts';const day=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const initial=()=>({notes:[],walks:[],departments:[...defaults],activeWalk:null,theme:'System',eod:'22:00',eow:6,lastDay:day()});let state=JSON.parse(localStorage.getItem(KEY)||'null')||initial(),drafts=JSON.parse(localStorage.getItem(dk)||'null')||{quick:null,walk:null},tab='Home',screen='',filter='All',deptView='General Notes',sort='Newest First',editMode='quick',editId=null,priorityDraft=false,dueType='EOD',photoData=null,detailId=null;
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&quot;':'&quot;',"'":'&#39;'}[c]));const cats=()=>['General Notes',...state.departments];const notes=()=>state.notes.filter(n=>!n.archived);const toast=s=>{el('toast').innerHTML='<span>'+esc(s)+'</span>';setTimeout(()=>el('toast').innerHTML='',2200)};
function save(){localStorage.setItem(KEY,JSON.stringify(state));backupNow();render()}function backupNow(){if(window.Android)Android.backup(JSON.stringify({version:1,data:state}))}function saveDraft(){if(editMode==='edit')return;drafts[editMode]={text:el('body').value,dept:el('dept').value,photo:photoData,priority:priorityDraft};localStorage.setItem(dk,JSON.stringify(drafts))}
function ordered(arr){return [...arr].sort((a,b)=>(Number(!!b.priority)-Number(!!a.priority))||(b.created-a.created))}
function schedule(n){if(window.Android)Android.cancelReminder(n.id)}
function toggle(id){let n=state.notes.find(n=>n.id===id);n.done=!n.done;n.completed=n.done?Date.now():null;n.archived=false;schedule(n);save()}
function row(n){return '<div class="item '+(n.done?'dim':'')+'"><input type="checkbox" '+(n.done?'checked':'')+' onchange="toggle(\''+n.id+'\')"><div class="content" onclick="editNote(\''+n.id+'\')">'+(n.priority?'<span class="priority-indicator" aria-label="Priority">★ </span>':'')+esc(n.text)+'<br><small>'+esc(n.dept)+'</small>'+(n.photo?'<br><img class="photo" src="'+n.photo+'">':'')+'</div></div>'}
function go(t){tab=t;screen='';render()}function render(){document.body.classList.toggle('dark',state.theme==='Dark'||state.theme==='System'&&matchMedia('(prefers-color-scheme: dark)').matches);el('nav').innerHTML=['Home','Tasks','Departments','Walks'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="go(\''+t+'\')"><span class="navicon">'+({Home:'⌂',Tasks:'☷',Departments:'♙',Walks:'♧'}[t])+'</span>'+t+'</button>').join('');let v=el('view');if(screen==='Settings'){settings(v);return}if(screen==='Department'){department(v);return}if(screen==='WalkDetail'){walkDetail(v);return}if(screen==='Today'){v.innerHTML='<button class="secondary" onclick="screen=\'\';render()">‹ Back</button><h2>Tasks Today</h2>'+ordered(notes().filter(n=>day(new Date(n.created))===day())).map(row).join('');return}if(tab==='Home'){let open=notes().filter(n=>!n.done);v.innerHTML='<div class="actions home-actions"><button onclick="openEditor(\'quick\')">＋ Add Task</button><button onclick="go(\'Walks\')">'+(state.activeWalk?'Open Walk':'Start Walk')+'</button></div><h3>Needs Attention</h3><div class="card task-list">'+(open.length?ordered(open).map(row).join(''):'<div class="empty">No tasks need attention right now.</div>')+'</div>';return}if(tab==='Tasks'){let arr=ordered(notes().filter(n=>filter==='All'||filter==='Completed'&&n.done||filter==='Open'&&!n.done));v.innerHTML='<h2>Tasks</h2><div class="actions">'+['All','Open','Completed'].map(t=>'<button class="'+(filter===t?'':'secondary')+'" onclick="filter=\''+t+'\';render()">'+t+'</button>').join('')+'</div><div class="card" style="margin-top:12px">'+arr.map(row).join('')+'</div>';return}if(tab==='Walks'){let w=state.walks.find(x=>x.id===state.activeWalk);v.innerHTML='<h2>Store Walks</h2>'+(w?'<div class="card"><input id="walkName" value="'+esc(w.name)+'" onchange="renameWalk(this.value)"><p class="muted">'+state.notes.filter(n=>n.walkId===w.id).length+' saved tasks</p><div class="actions"><button onclick="openEditor(\'walk\')">Add Walk Task</button><button class="secondary" onclick="endWalk()">End Walk</button></div></div>':'<button onclick="startWalk()">Start Store Walk</button>')+'<h3>Walk History</h3>'+state.walks.filter(x=>x.ended).slice().reverse().map(x=>'<button class="secondary" style="width:100%;margin:5px 0;text-align:left" onclick="detailId=\''+x.id+'\';screen=\'WalkDetail\';render()">'+esc(x.name)+' · '+state.notes.filter(n=>n.walkId===x.id).length+' tasks</button>').join('');return}v.innerHTML='<h2>Departments</h2>'+cats().map(d=>{let arr=notes().filter(n=>n.dept===d&&!n.done);return '<button class="secondary department-link" onclick="deptView=\''+esc(d).replace(/'/g,'&#39;')+'\';screen=\'Department\';render()">'+esc(d)+' <small>'+arr.length+' open</small></button>'}).join('')+'<button class="secondary" onclick="addDept()">+ Add Department</button>'}
function department(v){let arr=notes().filter(n=>n.dept===deptView);v.innerHTML='<button class="secondary" onclick="screen=\'\';render()">‹ Departments</button><h2>'+esc(deptView)+'</h2><div class="card" style="margin-top:12px">'+ordered(arr).map(row).join('')+'</div>'}
function startWalk(){let id=crypto.randomUUID();state.walks.push({id,name:'Store Walk — '+day(),created:Date.now(),ended:null});state.activeWalk=id;save()}
function renameWalk(name){let w=state.walks.find(x=>x.id===state.activeWalk);if(w){w.name=name.trim()||w.name;save()}}
function endWalk(){let w=state.walks.find(x=>x.id===state.activeWalk);if(!w)return;if(drafts.walk&&drafts.walk.text?.trim()){let a=confirm('Save unfinished walk task before ending? Press OK to save it, or Cancel to keep editing.');if(a){openEditor('walk');toast('Save the task, then end the walk')}return}w.ended=Date.now();state.activeWalk=null;if(!state.notes.some(n=>n.walkId===w.id))state.walks=state.walks.filter(x=>x.id!==w.id);else{detailId=w.id;screen='WalkDetail'}save()}
function walkDetail(v){let w=state.walks.find(x=>x.id===detailId);if(!w){screen='';render();return}let ns=state.notes.filter(n=>n.walkId===w.id);v.innerHTML='<button class="secondary" onclick="screen=\'\';render()">‹ Walks</button><h2>'+esc(w.name)+'</h2><div class="actions"><button onclick="emailWalk()">Email Walk</button><button class="secondary" onclick="let x=prompt(\'Walk name\',state.walks.find(w=>w.id===detailId).name);if(x){state.walks.find(w=>w.id===detailId).name=x;save()}">Rename</button><button class="danger" onclick="deleteWalk()">Delete Walk</button></div>'+cats().filter(d=>ns.some(n=>n.dept===d)).map(d=>'<h3>'+esc(d)+'</h3><div class="card">'+ordered(ns.filter(n=>n.dept===d)).map(row).join('')+'</div>').join('')}
function emailWalk(){let w=state.walks.find(x=>x.id===detailId),ns=state.notes.filter(n=>n.walkId===w.id);let body=w.name+'\n\n'+cats().filter(d=>ns.some(n=>n.dept===d)).map(d=>d+'\n'+ns.filter(n=>n.dept===d).map(n=>(n.done?'☑ ':'☐ ')+n.text).join('\n')).join('\n\n');if(window.Android)Android.email(w.name,body);else toast('Email available in Android app')}
function deleteWalk(){if(!confirm('Delete this walk and ALL associated tasks?'))return;state.notes.filter(n=>n.walkId===detailId).forEach(n=>window.Android&&Android.cancelReminder(n.id));state.notes=state.notes.filter(n=>n.walkId!==detailId);state.walks=state.walks.filter(w=>w.id!==detailId);screen='';save()}
function openEditor(mode,d){editMode=mode;editId=null;let x=d||(mode==='quick'?drafts.quick:drafts.walk)||{};fillEditor(x)}
function editNote(id){let n=state.notes.find(n=>n.id===id);if(!n)return;editMode='edit';editId=id;fillEditor({text:n.text,dept:n.dept,dueType:'Date',date:day(new Date(n.due)),photo:n.photo,priority:!!n.priority,notify:n.notify,early:n.early})}
function fillEditor(x){el('editorTitle').textContent=editMode==='edit'?'Edit Task':editMode==='walk'?'Store Walk Task':'Add Task';el('dept').innerHTML=cats().map(d=>'<option value="'+esc(d)+'">'+(d==='General Notes'?'General':esc(d))+'</option>').join('');el('dept').value=x.dept||'General Notes';el('body').value=x.text||'';photoData=x.photo||null;priorityDraft=!!x.priority;renderPriorityStar();el('deleteButton').style.display=editMode==='edit'?'':'none';el('saveSingle').style.display=editMode==='edit'?'none':'';el('saveButton').textContent=editMode==='edit'?'Save Changes':'Save + Next';showPhoto();el('editor').showModal();requestAnimationFrame(fitEditorToKeyboard)}
function fitEditorToKeyboard(){let d=el('editor');if(!d.open)return;let v=window.visualViewport;if(!v)return;d.style.bottom='auto';d.style.top=(v.offsetTop+v.height-8)+'px';d.style.transform='translateY(-100%)';d.style.maxHeight=Math.max(190,v.height-16)+'px'}
if(window.visualViewport){visualViewport.addEventListener('resize',fitEditorToKeyboard);visualViewport.addEventListener('scroll',fitEditorToKeyboard)}
function togglePriority(){priorityDraft=!priorityDraft;renderPriorityStar();saveDraft()}function renderPriorityStar(){let b=el('priorityStar');b.textContent=priorityDraft?'★':'☆';b.classList.toggle('selected',priorityDraft);b.setAttribute('aria-pressed',String(priorityDraft));b.setAttribute('aria-label',priorityDraft?'Remove priority':'Mark priority')}
function showPhoto(){el('preview').style.display=photoData?'block':'none';el('preview').src=photoData||'';el('removePhoto').disabled=!photoData}function closeEditor(){saveDraft();el('editor').close();el('editor').style.transform=''}
function saveEditor(keepOpen=true){let text=el('body').value.trim();if(!text)return toast('Enter a task');let n={text,dept:el('dept').value,photo:photoData,priority:priorityDraft,notify:false,early:0};if(editMode==='edit'){let old=state.notes.find(x=>x.id===editId);Object.assign(old,n);schedule(old);el('editor').close()}else{let obj={id:crypto.randomUUID(),created:Date.now(),completed:null,archived:false,done:false,walkId:editMode==='walk'?state.activeWalk:null,...n};state.notes.push(obj);schedule(obj);drafts[editMode]=null;localStorage.setItem(dk,JSON.stringify(drafts));el('body').value='';photoData=null;priorityDraft=false;renderPriorityStar();el('photo').value='';showPhoto();if(editMode==='quick')el('dept').value='General Notes';saveDraft();toast('Task saved');if(!keepOpen){el('editor').close();el('body').blur()}}save();if(keepOpen&&editMode!=='edit'){el('body').focus();requestAnimationFrame(fitEditorToKeyboard)}}
function deleteEditing(){if(!confirm('Delete this task?'))return;state.notes=state.notes.filter(n=>n.id!==editId);if(window.Android)Android.cancelReminder(editId);el('editor').close();save()}
function addDept(){let n=prompt('Department name');if(!n)return;n=n.trim();if(!n||n.length>40||cats().some(x=>x.toLowerCase()===n.toLowerCase()))return toast('Invalid or duplicate name');state.departments.push(n);save()}
function renameDept(i){let old=state.departments[i],n=prompt('Rename department',old);if(!n)return;n=n.trim();if(!n||n.length>40||cats().some(x=>x.toLowerCase()===n.toLowerCase()&&x!==old))return toast('Invalid name');state.departments[i]=n;state.notes.forEach(x=>{if(x.dept===old)x.dept=n});save()}
function removeDept(i){let d=state.departments[i];if(confirm('Move all tasks from '+d+' to General Notes? Press Cancel for more options.')){state.notes.forEach(n=>{if(n.dept===d)n.dept='General Notes'});state.departments.splice(i,1);save()}else if(confirm('Permanently delete department '+d+' and ALL its tasks?')){state.notes.filter(n=>n.dept===d).forEach(n=>window.Android&&Android.cancelReminder(n.id));state.notes=state.notes.filter(n=>n.dept!==d);state.departments.splice(i,1);save()}}
function settings(v){v.innerHTML='<button class="secondary" onclick="screen=\'\';render()">‹ Back</button><h2>Settings</h2><div class="card"><label>Theme</label><select onchange="state.theme=this.value;save()">'+['System','Light','Dark'].map(x=>'<option '+(state.theme===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Daily reset time</label><input type="time" value="'+state.eod+'" onchange="state.eod=this.value;save()"></div><div class="card"><h3>Automatic Backup</h3><p class="muted">Choose a folder for automatic backups after saved changes.</p><div class="actions"><button onclick="window.Android&&Android.chooseFolder()">Choose Folder</button><button class="secondary" onclick="window.Android&&Android.restore()">Restore</button></div></div><div class="card"><h3>Departments</h3>'+state.departments.map((d,i)=>'<div class="row" style="margin-bottom:9px"><span>'+esc(d)+'</span><button class="secondary" onclick="renameDept('+i+')">Rename</button><button class="danger" onclick="removeDept('+i+')">Delete</button></div>').join('')+'</div><div class="card"><h3>Archive</h3>'+state.notes.filter(n=>n.archived).map(n=>'<div class="item"><span>'+esc(n.text)+'</span><button class="secondary" onclick="let n=state.notes.find(x=>x.id===\''+n.id+'\');n.archived=false;n.completed=Date.now();save()">Restore</button></div>').join('')+'</div>'}
function restoreData(json){try{let x=JSON.parse(json);if(x.version!==1||!Array.isArray(x.data.notes))throw Error();let ids=new Set(state.notes.map(n=>n.id)),count=0;for(let n of x.data.notes)if(!ids.has(n.id)){state.notes.push(n);ids.add(n.id);count++}let walks=new Set(state.walks.map(w=>w.id));for(let w of x.data.walks||[])if(!walks.has(w.id))state.walks.push(w);for(let d of x.data.departments||[])if(!state.departments.includes(d))state.departments.push(d);state.notes.forEach(n=>{n.notify=false;schedule(n)});save();toast('Restored '+count+' tasks')}catch(e){toast('Invalid backup')}}
function housekeeping(){let now=Date.now(),changed=false;let todayEod=new Date(day()+'T'+state.eod).getTime();let lastEod=now>=todayEod?todayEod:todayEod-86400000;let lastClosed=Number(localStorage.getItem('ml.lastClosedAt')||0);if(lastEod>lastClosed){localStorage.setItem('ml.lastClosedAt',String(lastEod));drafts={quick:null,walk:null};localStorage.setItem(dk,JSON.stringify(drafts));if(state.activeWalk){let w=state.walks.find(w=>w.id===state.activeWalk);if(w){w.ended=lastEod;if(!state.notes.some(n=>n.walkId===w.id))state.walks=state.walks.filter(x=>x.id!==w.id)}state.activeWalk=null}state.lastDay=day();changed=true}for(let n of state.notes)if(n.done&&!n.archived&&n.completed&&now-n.completed>=14*86400000){n.archived=true;changed=true}if(changed)save()}
function onAppResume(){housekeeping();render()}
el('body').addEventListener('input',saveDraft);el('dept').addEventListener('change',saveDraft);el('photo').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.65);URL.revokeObjectURL(url);showPhoto();saveDraft()};img.src=url});housekeeping();render();
</script></body></html>
