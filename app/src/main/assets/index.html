function toggle(id){let n=state.notes.find(n=>n.id===id);n.done=!n.done;n.completed=n.done?Date.now():null;n.archived=false;schedule(n);save()}
function walkRow(n){return '<div class="item"><span>'+(n.done?'☑':'☐')+'</span><div class="content">'+esc(n.text)+(n.photo?'<br><img class="photo" src="'+n.photo+'">':'')+'</div></div>'}function row(n){return '<div class="item '+(n.done?'dim':'')+'"><input type="checkbox" '+(n.done?'checked':'')+' onchange="toggle(\''+n.id+'\')"><div class="content" onclick="editNote(\''+n.id+'\')">'+(n.priority?'<span class="priority-indicator" aria-label="Priority">★ </span>':'')+esc(n.text)+'<br><small>'+esc(n.dept)+(n.walkId?'<span class="walk-tag">Walk</span>':'')+'</small>'+(n.photo?'<br><img class="photo" src="'+n.photo+'">':'')+'</div></div>'}
function go(t){tab=t;screen='';render()}function render(){document.body.classList.toggle('dark',state.theme==='Dark'||state.theme==='System'&&matchMedia('(prefers-color-scheme: dark)').matches);if(window.Android&&Android.setNavigationTheme)Android.setNavigationTheme(document.body.classList.contains('dark'));el('nav').innerHTML=['Tasks','Departments','Walks','Notes'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="go(\''+t+'\')"><span class="navicon">'+({Home:'⌂',Tasks:'☷',Departments:'♙',Walks:'♧',Notes:'▤'}[t])+'</span>'+t+'</button>').join('');let v=el('view');if(screen==='Settings'){settings(v);return}if(screen==='Department'){department(v);return}if(screen==='WalkDetail'){walkDetail(v);return}if(screen==='Today'){v.innerHTML='<button class="secondary" onclick="screen=\'\';render()">‹ Back</button><h2>Tasks Today</h2>'+ordered(notes().filter(n=>day(new Date(n.created))===day())).map(row).join('');return}if(tab==='Notes'){renderReferenceNotes(v);return}if(tab==='Tasks'){let open=notes().filter(n=>!n.done),arr=ordered(notes().filter(n=>filter==='All'||filter==='Completed'&&n.done||filter==='Open'&&!n.done));v.innerHTML='<button class="task-fab" onclick="openEditor(\'quick\')" aria-label="Add Task">＋ Add Task</button><div class="section-heading"><h3>Task List</h3></div><div class="filter-strip">'+['Open','All','Completed'].map(t=>'<button class="'+(filter===t?'selected':'')+'" onclick="filter=\''+t+'\';render()">'+t+'</button>').join('')+'</div><div class="card task-list">'+(arr.length?arr.map(row).join(''):'<div class="empty">No tasks in this view.</div>')+'</div>';return}if(tab==='Walks'){let w=state.walks.find(x=>x.id===state.activeWalk);v.innerHTML='<h2>Store Walks</h2>'+(w?'<div class="card"><input id="walkName" value="'+esc(w.name)+'" onchange="renameWalk(this.value)"><p class="muted">'+state.notes.filter(n=>n.walkId===w.id).length+' saved tasks</p><div class="actions"><button class="secondary" onclick="endWalk()">End Walk</button></div></div>':'')+'<button class="task-fab" onclick="'+(w?'openEditor(\'walk\')':'startWalk()')+'">'+(w?'＋ Add Walk Task':'＋ Start Walk')+'</button>')+'<h3>Walk History</h3>'+state.walks.filter(x=>x.ended).slice().reverse().map(x=>'<button class="secondary" style="width:100%;margin:5px 0;text-align:left" onclick="detailId=\''+x.id+'\';screen=\'WalkDetail\';render()">'+esc(x.name)+' · '+(x.snapshot||state.notes.filter(n=>n.walkId===x.id)).length+' tasks · '+day(new Date(x.ended))+'</button>').join('');return}v.innerHTML='<h2>Departments</h2>'+cats().map(d=>{let arr=notes().filter(n=>n.dept===d&&!n.done);return '<button class="secondary department-link" onclick="deptView=\''+esc(d).replace(/'/g,'&#39;')+'\';screen=\'Department\';render()">'+esc(d)+' <small>'+arr.length+' open</small></button>'}).join('')+'<button class="secondary" onclick="addDept()">+ Add Department</button>'}

let refEditId=null,refSearch='',refPhotoDraft=[];
function renderReferenceNotes(v){v.innerHTML='<h2>Notes</h2><button onclick="openReferenceNote()">Add Note</button><input style="margin:12px 0" placeholder="Search notes..." value="'+esc(refSearch)+'" oninput="refSearch=this.value;renderReferenceNotesList()"><div id="referenceList" class="card scroll-list"></div>';renderReferenceNotesList()}
function renderReferenceNotesList(){let v=el('referenceList');if(!v)return;let found=state.referenceNotes.filter(n=>(n.title+' '+n.category+' '+n.details).toLowerCase().includes(refSearch.toLowerCase()));v.innerHTML=found.length?found.map(n=>'<div class="item"><div class="content"><strong>'+esc(n.title)+'</strong><br><small>'+esc(n.category)+'</small><p>'+esc(n.details)+'</p>'+((n.photos||[]).map(p=>'<img class="photo" style="width:110px;height:110px;object-fit:cover" src="'+p+'">').join(''))+'<div class="actions"><button class="secondary" onclick="openReferenceNote(\''+n.id+'\')">Edit</button><button class="secondary" onclick="copyReferenceNote(\''+n.id+'\')">Copy</button><button class="danger" onclick="deleteReferenceNote(\''+n.id+'\')">Delete</button></div></div></div>').join(''):'<div class="empty">No notes found.</div>'}
function renderRefPhotos(){el('refPhotos').innerHTML=refPhotoDraft.map((p,i)=>'<div><img class="photo" style="width:100px;height:100px;object-fit:cover" src="'+p+'"><button type="button" class="danger" onclick="removeRefPhoto('+i+')">Remove</button></div>').join('')}
function removeRefPhoto(i){refPhotoDraft.splice(i,1);renderRefPhotos()}
function copyReferenceNote(id){let n=state.referenceNotes.find(x=>x.id===id);if(n&&navigator.clipboard)navigator.clipboard.writeText(n.details).then(()=>toast('Copied')).catch(()=>toast('Copy unavailable'))}
function deleteReferenceNote(id){if(!confirm('Delete this note?'))return;state.referenceNotes=state.referenceNotes.filter(n=>n.id!==id);save()}


function openReferenceNote(id){refEditId=id||null;let n=state.referenceNotes.find(x=>x.id===id);el('refHeading').textContent=n?'Edit Note':'Add Note';el('refTitle').value=n?.title||'';el('refDetails').value=n?.details||'';refPhotoDraft=[...(n?.photos||[])];renderRefPhotos();updateReferenceCategories(n?.category||'General');el('referenceEditor').showModal()}
function updateReferenceCategories(selected){el('refCategory').innerHTML=state.noteCategories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');el('refCategory').value=selected}
function addReferenceCategory(){let n=prompt('New category name');if(n===null)return;n=n.trim();if(!n)return toast('Enter category name');let existing=state.noteCategories.find(c=>c.toLowerCase()===n.toLowerCase());if(existing)n=existing;else{state.noteCategories.push(n);save()}updateReferenceCategories(n)}
function saveReferenceNote(){let title=el('refTitle').value.trim();if(!title)return toast('Enter a title');let data={title,details:el('refDetails').value.trim(),category:el('refCategory').value,photos:[...refPhotoDraft]};if(refEditId){let n=state.referenceNotes.find(x=>x.id===refEditId);if(n)Object.assign(n,data)}else state.referenceNotes.unshift({id:crypto.randomUUID(),...data});el('referenceEditor').close();save()}

function department(v){let arr=notes().filter(n=>n.dept===deptView).sort((a,b)=>Number(!!a.done)-Number(!!b.done)||Number(!!b.priority)-Number(!!a.priority)||b.created-a.created);v.innerHTML='<button class="secondary" onclick="screen=\'\';render()">‹ Departments</button><h2>'+esc(deptView)+'</h2><div class="card" style="margin-top:12px">'+arr.map(row).join('')+'</div>'}
function startWalk(){let id=crypto.randomUUID();state.walks.push({id,name:'Store Walk — '+day(),created:Date.now(),ended:null});state.activeWalk=id;save()}
function renameWalk(name){let w=state.walks.find(x=>x.id===state.activeWalk);if(w){w.name=name.trim()||w.name;save()}}
function endWalk(){let w=state.walks.find(x=>x.id===state.activeWalk);if(!w)return;if(drafts.walk&&drafts.walk.text?.trim()){let a=confirm('Save unfinished walk task before ending? Press OK to save it, or Cancel to keep editing.');if(a){openEditor('walk');toast('Save the task, then end the walk')}return}w.ended=Date.now();w.snapshot=state.notes.filter(n=>n.walkId===w.id).map(n=>({...n}));state.activeWalk=null;if(!state.notes.some(n=>n.walkId===w.id))state.walks=state.walks.filter(x=>x.id!==w.id);else{detailId=w.id;screen='WalkDetail'}save()}
function walkDetail(v){let w=state.walks.find(x=>x.id===detailId);if(!w){screen='';render();return}let ns=w.snapshot||state.notes.filter(n=>n.walkId===w.id);v.innerHTML='<button class="secondary" onclick="screen=\'\';render()">‹ Walks</button><h2>'+esc(w.name)+'</h2><div class="actions"><button onclick="emailWalk()">Email Walk</button><button class="secondary" onclick="let x=prompt(\'Walk name\',state.walks.find(w=>w.id===detailId).name);if(x){state.walks.find(w=>w.id===detailId).name=x;save()}">Rename</button><button class="danger" onclick="deleteWalk()">Delete Walk</button></div>'+cats().filter(d=>ns.some(n=>n.dept===d)).map(d=>'<h3>'+esc(d)+'</h3><div class="card">'+ordered(ns.filter(n=>n.dept===d)).map(walkRow).join('')+'</div>').join('')}
function emailWalk(){let w=state.walks.find(x=>x.id===detailId),ns=w.snapshot||state.notes.filter(n=>n.walkId===w.id);let body=w.name+'\n\n'+cats().filter(d=>ns.some(n=>n.dept===d)).map(d=>d+'\n'+ns.filter(n=>n.dept===d).map(n=>(n.done?'☑ ':'☐ ')+n.text).join('\n')).join('\n\n');if(window.Android)Android.email(w.name,body);else toast('Email available in Android app')}
function deleteWalk(){if(!confirm('Delete this walk and ALL associated tasks?'))return;state.notes.filter(n=>n.walkId===detailId).forEach(n=>window.Android&&Android.cancelReminder(n.id));state.notes=state.notes.filter(n=>n.walkId!==detailId);state.walks=state.walks.filter(w=>w.id!==detailId);screen='';save()}
function openEditor(mode,d){editMode=mode;editId=null;let x=d||(mode==='quick'?drafts.quick:drafts.walk)||{};fillEditor(x)}
function editNote(id){let n=state.notes.find(n=>n.id===id);if(!n)return;editMode='edit';editId=id;fillEditor({text:n.text,dept:n.dept,dueType:'Date',date:day(new Date(n.due)),photo:n.photo,priority:!!n.priority,notify:n.notify,early:n.early})}
function fillEditor(x){el('editorTitle').textContent=editMode==='edit'?'Edit Task':editMode==='walk'?'Store Walk Task':'Add Task';el('dept').innerHTML=cats().map(d=>'<option value="'+esc(d)+'">'+(d==='General Notes'?'General':esc(d))+'</option>').join('');el('dept').value=x.dept||'General Notes';el('body').value=x.text||'';photoData=x.photo||null;priorityDraft=!!x.priority;renderPriorityStar();el('deleteButton').style.display=editMode==='edit'?'':'none';el('saveSingle').style.display=editMode==='edit'?'none':'';el('saveButton').textContent=editMode==='edit'?'Save Changes':'Save + Next';showPhoto();el('editor').showModal();requestAnimationFrame(fitEditorToKeyboard)}
function resetEditorPosition(){let d=el('editor');d.style.top='';d.style.bottom='';d.style.transform='';d.style.maxHeight=''}
function fitEditorToKeyboard(){let d=el('editor');if(!d.open)return;let v=window.visualViewport;if(!v)return;d.style.bottom='auto';d.style.top=(v.offsetTop+v.height-8)+'px';d.style.transform='translateY(-100%)';d.style.maxHeight=Math.max(190,v.height-16)+'px'}
if(window.visualViewport){visualViewport.addEventListener('resize',fitEditorToKeyboard);visualViewport.addEventListener('scroll',fitEditorToKeyboard)}
function togglePriority(){priorityDraft=!priorityDraft;renderPriorityStar();saveDraft()}function renderPriorityStar(){let b=el('priorityStar');b.textContent=priorityDraft?'★':'☆';b.classList.toggle('selected',priorityDraft);b.setAttribute('aria-pressed',String(priorityDraft));b.setAttribute('aria-label',priorityDraft?'Remove priority':'Mark priority')}
function showPhoto(){el('preview').style.display=photoData?'block':'none';el('preview').src=photoData||'';el('removePhoto').disabled=!photoData}function closeEditor(){saveDraft();el('body').blur();el('editor').close();resetEditorPosition()}
function saveEditor(keepOpen=true){let text=el('body').value.trim();if(!text)return toast('Enter a task');let n={text,dept:el('dept').value,photo:photoData,priority:priorityDraft,notify:false,early:0};if(editMode==='edit'){let old=state.notes.find(x=>x.id===editId);Object.assign(old,n);schedule(old);el('body').blur();el('editor').close();resetEditorPosition()}else{let obj={id:crypto.randomUUID(),created:Date.now(),completed:null,archived:false,done:false,walkId:editMode==='walk'?state.activeWalk:null,...n};state.notes.push(obj);schedule(obj);drafts[editMode]=null;localStorage.setItem(dk,JSON.stringify(drafts));el('body').value='';photoData=null;priorityDraft=false;renderPriorityStar();el('photo').value='';showPhoto();if(editMode==='quick')el('dept').value='General Notes';saveDraft();toast('Task saved');if(!keepOpen){el('body').blur();el('editor').close();resetEditorPosition()}}save();if(keepOpen&&editMode!=='edit'){el('body').focus();requestAnimationFrame(fitEditorToKeyboard)}}
function deleteEditing(){if(!confirm('Delete this task?'))return;state.notes=state.notes.filter(n=>n.id!==editId);if(window.Android)Android.cancelReminder(editId);el('editor').close();resetEditorPosition();save()}
function addDept(){let n=prompt('Department name');if(!n)return;n=n.trim();if(!n||n.length>40||cats().some(x=>x.toLowerCase()===n.toLowerCase()))return toast('Invalid or duplicate name');state.departments.push(n);save()}
function renameDept(i){let old=state.departments[i],n=prompt('Rename department',old);if(!n)return;n=n.trim();if(!n||n.length>40||cats().some(x=>x.toLowerCase()===n.toLowerCase()&&x!==old))return toast('Invalid name');state.departments[i]=n;state.notes.forEach(x=>{if(x.dept===old)x.dept=n});save()}
function removeDept(i){let d=state.departments[i];if(confirm('Move all tasks from '+d+' to General Notes? Press Cancel for more options.')){state.notes.forEach(n=>{if(n.dept===d)n.dept='General Notes'});state.departments.splice(i,1);save()}else if(confirm('Permanently delete department '+d+' and ALL its tasks?')){state.notes.filter(n=>n.dept===d).forEach(n=>window.Android&&Android.cancelReminder(n.id));state.notes=state.notes.filter(n=>n.dept!==d);state.departments.splice(i,1);save()}}
function settings(v){v.innerHTML='<button class="secondary" onclick="screen=\'\';render()">‹ Back</button><h2>Settings</h2><div class="card"><label>Theme</label><select onchange="state.theme=this.value;save()">'+['System','Light','Dark'].map(x=>'<option '+(state.theme===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Daily reset time</label><input type="time" value="'+state.eod+'" onchange="state.eod=this.value;save()"></div><div class="card"><h3>Automatic Backup</h3><p class="muted">Choose a folder for automatic backups after saved changes.</p><div class="actions"><button onclick="window.Android&&Android.chooseFolder()">Choose Folder</button><button class="secondary" onclick="window.Android&&Android.restore()">Restore</button></div></div><div class="card"><h3>Departments</h3>'+state.departments.map((d,i)=>'<div class="row" style="margin-bottom:9px"><span>'+esc(d)+'</span><button class="secondary" onclick="renameDept('+i+')">Rename</button><button class="danger" onclick="removeDept('+i+')">Delete</button></div>').join('')+'</div><div class="card"><h3>Archive</h3>'+state.notes.filter(n=>n.archived).map(n=>'<div class="item"><span>'+esc(n.text)+'</span><button class="secondary" onclick="let n=state.notes.find(x=>x.id===\''+n.id+'\');n.archived=false;n.completed=Date.now();save()">Restore</button></div>').join('')+'</div>'}
function restoreData(json){try{let x=JSON.parse(json);if(x.version!==1||!Array.isArray(x.data.notes))throw Error();let ids=new Set(state.notes.map(n=>n.id)),count=0;for(let n of x.data.notes)if(!ids.has(n.id)){state.notes.push(n);ids.add(n.id);count++}let walks=new Set(state.walks.map(w=>w.id));for(let w of x.data.walks||[])if(!walks.has(w.id))state.walks.push(w);for(let d of x.data.departments||[])if(!state.departments.includes(d))state.departments.push(d);for(let n of x.data.referenceNotes||[])if(!state.referenceNotes.some(x=>x.id===n.id))state.referenceNotes.push(n);for(let c of x.data.noteCategories||[])if(!state.noteCategories.includes(c))state.noteCategories.push(c);state.notes.forEach(n=>{n.notify=false;schedule(n)});save();toast('Restored '+count+' tasks')}catch(e){toast('Invalid backup')}}
function housekeeping(){let now=Date.now(),changed=false;let todayEod=new Date(day()+'T'+state.eod).getTime();let lastEod=now>=todayEod?todayEod:todayEod-86400000;let lastClosed=Number(localStorage.getItem('ml.lastClosedAt')||0);if(lastEod>lastClosed){localStorage.setItem('ml.lastClosedAt',String(lastEod));drafts={quick:null,walk:null};localStorage.setItem(dk,JSON.stringify(drafts));if(state.activeWalk){let w=state.walks.find(w=>w.id===state.activeWalk);if(w){w.ended=lastEod;w.snapshot=state.notes.filter(n=>n.walkId===w.id).map(n=>({...n}));if(!state.notes.some(n=>n.walkId===w.id))state.walks=state.walks.filter(x=>x.id!==w.id)}state.activeWalk=null}state.lastDay=day();changed=true}for(let n of state.notes)if(n.done&&!n.archived&&n.completed&&now-n.completed>=14*86400000){n.archived=true;changed=true}if(changed)save()}
function onAppResume(){housekeeping();render()}
el('refPhoto').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);refPhotoDraft.push(c.toDataURL('image/jpeg',.65));URL.revokeObjectURL(url);e.target.value='';renderRefPhotos()};img.src=url});
el('body').addEventListener('input',saveDraft);el('dept').addEventListener('change',saveDraft);el('photo').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.65);URL.revokeObjectURL(url);showPhoto();saveDraft()};img.src=url});housekeeping();render();
</script></body></html>
