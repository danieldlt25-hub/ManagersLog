name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners include the Android SDK.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CLIMBING_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing CLIMBING_KEYSTORE secret'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/release.keystore"
      - name: Build signed release APK
        env:
          CLIMBING_STORE_PASSWORD: ${{ secrets.CLIMBING_STORE_PASSWORD }}
          CLIMBING_KEY_ALIAS: ${{ secrets.CLIMBING_KEY_ALIAS }}
          CLIMBING_KEY_PASSWORD: ${{ secrets.CLIMBING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ManagersLog-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
